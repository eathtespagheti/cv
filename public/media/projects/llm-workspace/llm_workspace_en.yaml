  - type: text
    title: "Agentic coding workflow"
    body: |
      The stack exists to support how I actually build software. My daily driver is **OpenCode**, and the pattern that has made the biggest difference is treating agent behaviour as configuration rather than prompting it ad hoc:

      - **Project rules** live in `AGENTS.md` files next to the code they govern, so conventions, build commands and constraints are loaded automatically.
      - **Custom skills** package procedures the agent should follow exactly — for this CV site, that means skills for writing the CV, drafting cover letters, screening applications and handling untrusted job postings.
      - **Subagents** are scoped, least-privilege workers (for example a read-only docs keeper), so specialised tasks cannot wander outside their remit.
      - **Plan-driven workflows** come from the Superpowers plugin: brainstorm before building, debug systematically, write tests first and verify before claiming completion.

      The same approach runs across my other repositories, with skills and agents tailored to each project's deployment model and constraints. OmniRoute's request-level control is what makes it practical: routing, fallback and compression are configured once and apply to every client and tool.

  - type: divider

  - type: text
    title: "What it demonstrates"
    body: |
      Building and running this stack is how I keep current on the platform side of AI: self-hosting stateful workloads on Kubernetes, wiring OIDC and automated TLS, managing AI gateways and MCP infrastructure, and — most importantly — turning agentic coding from a novelty into a repeatable engineering workflow with reviewable rules and skills.
