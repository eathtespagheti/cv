blocks:

  - type: text
    title: "Overview"
    body: |
      This is the LLM and agentic-coding layer I run on top of my Kubernetes homelab. I built it to get the leverage of hosted AI tooling without giving up control of my prompts, data or provider choice — and because operating the stack myself is the fastest way to understand how these systems actually behave.

      Everything lives in the same GitOps repository as the rest of the cluster: a change is a commit, Flux reconciles it, and every secret is SOPS-encrypted with age before it reaches Git. Identity is centralised in Keycloak, TLS is issued by cert-manager, and all six services are published through a single shared ingress. Nothing here is a toy — it is the workspace I develop on every day.

  - type: divider

  - type: text
    title: "The LLM stack"
    body: |
      The stack is deliberately composable, with each service doing one job:

      - **Open WebUI** — the chat front-end, federated to Keycloak for OIDC login and pointed at OmniRoute as its OpenAI-compatible backend.
      - **OmniRoute** — an OpenAI-compatible AI gateway. It routes requests across providers with automatic fallback, applies prompt compression to cut token usage, keeps a Qdrant-backed memory store and exposes MCP tools.
      - **MetaMCP** — an MCP aggregator and gateway. It runs several MCP servers as child processes and proxies remote ones over streamable HTTP, then groups them into namespaces and endpoints so a client sees only the tools a task needs.
      - **SearxNG** — self-hosted metasearch, wired into the agents as a search tool.
      - **Open Terminal** — a browser terminal companion for long-running work.
      - **Ollama** — an external Linux host on the LAN running local models, registered with Open WebUI as an additional backend.

      CloudNativePG provides the PostgreSQL that MetaMCP and the other stateful services share; Valkey caches gateway state and Qdrant holds vectors for memory and retrieval. The database, cache and vector store are the only persistent pieces, and each is a first-class cluster workload rather than a hand-managed host.

