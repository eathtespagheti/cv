title: "Self-Hosted LLM & Agentic Coding Workspace"
role: "Architect / Operator"
year: "2026 — present"
tagline: "A GitOps-run LLM platform and agentic-coding toolchain at home — chat, an OpenAI-compatible gateway, an MCP aggregator and local models behind one OIDC-secured ingress."
shareable: true

platforms: [Kubernetes, Self-hosted, AI]
