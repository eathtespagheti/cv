  - type: text
    title: "Workflow di agentic coding"
    body: |
      Lo stack esiste per supportare come costruisco davvero il software. Il mio strumento quotidiano è **OpenCode**, e il pattern che ha fatto la differenza più grande è trattare il comportamento dell'agente come configurazione invece di sollecitarlo caso per caso:

      - **Regole di progetto** in file `AGENTS.md` accanto al codice che governano, così convenzioni, comandi di build e vincoli vengono caricati automaticamente.
      - **Skill personalizzate** che impacchettano procedure che l'agente deve seguire esattamente — per questo sito CV significa skill per scrivere il CV, redigere lettere di presentazione, valutare candidature e gestire annunci di lavoro non attendibili.
      - **Subagenti** con permessi minimi e ambito ristretto (per esempio un docs keeper in sola lettura), così i compiti specializzati non escono dal proprio perimetro.
      - **Workflow guidati da piani** tramite il plugin Superpowers: fare brainstorming prima di costruire, debuggare in modo sistematico, scrivere prima i test e verificare prima di dichiarare il lavoro concluso.

      Lo stesso approccio è in uso negli altri miei repository, con skill e agenti su misura per il modello di deploy e i vincoli di ogni progetto. Il controllo a livello di richiesta di OmniRoute è ciò che lo rende pratico: routing, fallback e compressione si configurano una volta e valgono per ogni client e tool.

  - type: divider

  - type: text
    title: "Cosa dimostra"
    body: |
      Costruire ed eseguire questo stack è il modo con cui resto aggiornato sul lato platform dell'AI: self-hosting di workload stateful su Kubernetes, integrazione di OIDC e TLS automatico, gestione di gateway AI e infrastruttura MCP e — soprattutto — trasformare l'agentic coding da novità a workflow di ingegneria ripetibile, con regole e skill verificabili.
