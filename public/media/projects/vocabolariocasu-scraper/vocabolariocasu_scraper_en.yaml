  - type: text
    title: "Overview"
    body: |
      A minimal scraper for an online Sardo dictionary, built with Python and Beautiful Soup.

      The interesting constraint was the target: it was designed to run on a smartphone. That ruled out heavyweight dependencies and forced a genuinely minimal implementation — which is a useful exercise, because most scrapers I have written have been solving for a machine that does not matter.

