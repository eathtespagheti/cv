title: "Advanced Kubernetes Homelab & Cross-Site Infrastructure"
role: "Architect / Operator"
year: "2019 — present"
tagline: "A single-node Kubernetes cluster running at home, with eBPF networking, GitOps and centralised identity."
shareable: true

platforms: [Kubernetes, Linux, Self-hosted]
stack: [kubeadm, Cilium, eBPF, Flux Operator, SOPS, age, Keycloak, OIDC, cert-manager, Headscale, Gateway API, CloudNativePG, k8s-gateway, Prometheus, Grafana, Hubble]

blocks:

  - type: text
    title: "Overview"
    body: |
      This is my own infrastructure, built and run at home since 2019 — the project I use to keep current on platform engineering and to try things safely before proposing them at work.

      It began as a single Docker host and was migrated to a kubeadm-managed Kubernetes cluster. Everything is declarative: the repository is the single source of truth, Flux continuously reconciles it, and every secret is encrypted at rest with SOPS and age before it ever reaches Git. There is no imperative `kubectl apply` in day-to-day operation — a change is a commit, and the cluster converges.

      The cluster is a genuine reference implementation rather than a toy. It runs a full personal cloud — photos, media, a password manager, home automation and EV telemetry — all under a single domain, with centralised identity and a deliberately minimal public attack surface.

  - type: divider

  - type: image
    src: /media/projects/kubernetes-homelab/architecture.png
    alt: "Architecture: Cloudflare, a single forwarded Cilium Envoy ingress on the home LAN, LAN/VPN-only dedicated ingresses and an internal DNS resolver, all feeding the cluster workloads"
    caption: "One public entry point; everything else is LAN/VPN-only."
    natural: true

  - type: text
    title: "Architecture: one public entry point"
    body: |
      The exposure model is the part I am most deliberate about.

      - A single **Cilium Envoy ingress is the only service port-forwarded** from the internet; shared-mode ingresses are multiplexed behind it by SNI/Host.
      - **`dedicated` ingresses and standalone `LoadBalancer` services get LAN-only addresses** and are reachable only from the LAN or the Headscale VPN — even though their DNS names resolve publicly.
      - **Cilium owns the datapath**: an eBPF kube-proxy replacement, L2 announcements so `LoadBalancer` addresses work without a hardware load balancer, an integrated ingress controller, and Gateway API.

      The mental model — public names do not imply public reachability, and the boundary is enforced at both the router and the DNS layer — is the one I use on production estates.

  - type: divider

  - type: text
    title: "Operating the cluster"
    body: |
      Day-to-day the cluster is managed through **Headlamp**, a Kubernetes dashboard sitting behind the same Keycloak SSO, so routine visibility does not require handing out kubeconfigs.

      At the time of writing it runs 90 Pods, 66 Deployments, 5 StatefulSets and 15 Jobs across the platform and application namespaces — all reporting healthy.

