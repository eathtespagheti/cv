title: "teslamate-fuel-roi"
role: "Author / Operator"
year: "2026 — present"
tagline: "Italy's official weekly fuel prices joined to TeslaMate's trip data, turned into two Grafana dashboards that show the fuel money an EV avoids — and when it pays itself back."
shareable: true

platforms: [Kubernetes, Docker, PostgreSQL, Grafana]
stack: [Grafana, PostgreSQL, SQL, Shell (POSIX sh), jq, curl, Docker, Docker Compose, Kubernetes, Kustomize, GitLab CI/CD, GitHub Actions, shellcheck, BuildKit]

blocks:

  - type: text
    title: "Overview"
    body: |
      This started as a question I actually had: now that the car is electric, how much fuel money has it avoided, and when does that add up to the price of the car? TeslaMate already logs every drive, charge and cost — what it cannot know is what petrol or diesel would have cost on the same days. So I built the missing half and paired the two in Grafana.

      One container does the whole job in a single pass. It downloads Italy's official weekly fuel-price report from MASE, validates it fail-closed, converts it to CSV, and upserts any previously unseen weeks into a `fuel.prices` table alongside my existing TeslaMate data. Two Grafana dashboards then read TeslaMate's tables and that table together: one reports gross and net fuel savings, the other tracks net savings against the EV purchase price and estimates a break-even date.

      It is deliberately Italy-only. The price feed, the table schema and the dashboards all assume the Italian MASE report, and a country/provider abstraction is explicitly out of scope.

