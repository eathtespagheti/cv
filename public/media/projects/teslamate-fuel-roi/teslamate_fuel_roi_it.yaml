  - type: divider

  - type: text
    title: "Cosa mostrano le dashboard"
    body: |
      `ev-fuel-savings` risponde alla metà più semplice della domanda: quanta strada è stata percorsa, quanti litri di carburante avrebbe bruciato quella strada e quanto sarebbero costati quei litri ai prezzi in vigore alla data di ogni viaggio. Tre pannelli stat danno i totali — distanza percorsa, litri evitati e costo del carburante evitato — e una timeseries scompone le stesse cifre settimana per settimana, accanto a un confronto dei prezzi dei carburanti, così il trend dei prezzi alla base del risparmio resta visibile.

      `ev-roi` risponde alla seconda metà: il risparmio paga l'auto? Mostra il risparmio netto nell'intervallo selezionato — costo del carburante evitato meno costo di ricarica — il risparmio netto medio settimanale, un gauge di avanzamento verso il break-even rispetto al prezzo d'acquisto e la data stimata di break-even. Sotto, il risparmio cumulato con le componenti settimanali di carburante, elettricità e netto.

