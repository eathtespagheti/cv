title: "teslamate-fuel-roi"
role: "Autore / Operatore"
year: "2026 — presente"
tagline: "I prezzi ufficiali settimanali dei carburanti in Italia uniti ai dati di viaggio di TeslaMate, trasformati in due dashboard Grafana che mostrano il carburante che un'EV evita — e quando si ripaga da sola."
shareable: true

platforms: [Kubernetes, Docker, PostgreSQL, Grafana]
stack: [Grafana, PostgreSQL, SQL, Shell (POSIX sh), jq, curl, Docker, Docker Compose, Kubernetes, Kustomize, GitLab CI/CD, GitHub Actions, shellcheck, BuildKit]

blocks:

  - type: text
    title: "Panoramica"
    body: |
      È nato da una domanda che avevo davvero: ora che l'auto è elettrica, quanto carburante ha evitato e quando quella cifra arriva a valere il prezzo dell'auto? TeslaMate registra già ogni viaggio, ricarica e costo — quello che non può sapere è quanto sarebbero costati benzina o diesel negli stessi giorni. Così ho costruito l'altra metà e le ho messe insieme in Grafana.

      Un solo container fa tutto il lavoro in un unico passaggio. Scarica il report settimanale ufficiale dei prezzi dei carburanti del MASE, lo valida fail-closed, lo converte in CSV e inserisce le settimane non ancora viste in una tabella `fuel.prices` accanto ai dati TeslaMate esistenti. Due dashboard Grafana leggono poi insieme le tabelle di TeslaMate e quella tabella: una riporta il risparmio lordo e netto di carburante, l'altra confronta il risparmio netto con il prezzo d'acquisto dell'EV e stima una data di break-even.

      È volutamente solo per l'Italia. Il feed dei prezzi, lo schema della tabella e le dashboard assumono tutti il report MASE italiano, e un'astrazione per paese/provider è esplicitamente fuori scope.

