  - type: divider

  - type: text
    title: "Printing it"
    body: |
      The model keeps a single `FIT_TOLERANCE` constant that the mating dimensions derive from, so a fit can be loosened or tightened for a particular printer in one place. The README documents three ready configurations — funnel only, funnel with threads, and the threaded insert plus magnetic split — with a render of each.

