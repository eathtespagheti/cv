stages:
  - validate
  - container

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  # Keep the lockfile-driven npm cache inside the project dir.
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# ---------------------------------------------------------------------------
# Validate — build the site on every push.
#
# This is the gate that matters: the Astro content layer validates on build, so
# a malformed CV YAML entry fails here rather than reaching main and breaking
# the deployed site.
# ---------------------------------------------------------------------------
validate:
  stage: validate
  image: node:22-bookworm-slim
  variables:
    GIT_DEPTH: 0
    # Match the Dockerfile: use Playwright's bundled Chromium, not branded
    # Chrome. `CI` is deliberately unset (see the Dockerfile for why).
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - ms-playwright/
  script:
    - npm ci
    # Fast, browser-free regression tests for content formatting (text blocks).
    - npm test
    - npx playwright install --with-deps chromium
    - npm run build
    # Guard: no build-time YAML may survive into a built dist/ (see ticket #4).
    - npm run check:dist
    # Fail loudly if the cover letter generator is broken.
    - npm run letter -- example
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - dist/

# ---------------------------------------------------------------------------
# Container — build and push the image on tagged releases only.
#
# Deploying on branch pushes would be wrong here: `git describe` reduces many
# commits to one release number, so every push after a tag would silently
# overwrite the same image tag and a version number would end up pointing at an
# unreviewed commit. Instead, the image tag IS the git tag — exactly one image
# per release, and nothing the Flux ImagePolicy sees is ambiguous.
#
# To release: bump the version in whatever you bump it, then
#   git tag -a v1.2.0 -m "..." && git push --tags
# ---------------------------------------------------------------------------
container:
  stage: container
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # Fail before building if the tag is not the SemVer shape the Flux
    # ImagePolicy filters on (`^v(?P<ts>.*)$`, semver range >=1).
    - |
      case "$CI_COMMIT_TAG" in
        v[0-9]*.[0-9]*.[0-9]*) echo "Releasing $CI_COMMIT_TAG" ;;
        *) echo "✗ Tag '$CI_COMMIT_TAG' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
      esac
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE:$CI_COMMIT_TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_TAG"
    - docker push "$IMAGE:latest"
  rules:
    - if: $CI_COMMIT_TAG
