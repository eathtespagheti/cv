server {
    listen 8080;
    server_name _;

    # TLS terminates at the ingress and nginx only ever sees plain HTTP on :8080,
    # so any absolute redirect it generates would point at
    # "http://<host>:8080/..." — the internal port and the wrong scheme, both
    # unreachable from the internet. Emit relative redirects instead so the
    # client resolves them against the scheme and host it actually used.
    #
    # This matters for real requests: the site links to `/senior` and `/projects`
    # (Astro emits directories, so those are 301s to the trailing-slash form).
    absolute_redirect off;
    port_in_redirect off;

    # The project pages moved from /showcase to /projects. Keep every old link
    # working (the CV and anything already shared point at /showcase/...).
    # Assumes the site is served from the root (BASE_PATH=/), which production is.
    rewrite ^/showcase(/.*)?$ /projects$1 permanent;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the container's writable paths inside /tmp — the unprivileged image
    # cannot write to /var/cache/nginx.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Consumed by the Dockerfile HEALTHCHECK and the Kubernetes probes.
    # `default_type` sets the Content-Type; `add_header` would *append* to
    # the default and produce "application/octet-stream,text/plain".
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Generated resumes. Long-lived, content-addressed by name.
    location /downloads/ {
        add_header Cache-Control "public, max-age=86400";
        types { application/pdf pdf; }
    }

    # Hashed assets — safe to cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # nginx's bundled mime.types has no YAML entry, so /cv/*.yaml and the
    # case-study YAML under /media/projects/** fell through to
    # application/octet-stream. application/yaml is the RFC 9512 type.
    #
    # Set it via `default_type`, not a `types { ... }` block: a `types` block in
    # a location replaces the inherited mime.types map wholesale, which would
    # strip every other content type for these requests.
    location ~ \.(yaml|yml)$ {
        default_type application/yaml;
    }

    # Astro emits per-page directories; try the extensionless URL first.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    # Don't advertise the server version.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
