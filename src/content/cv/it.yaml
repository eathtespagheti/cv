  - company: Abika
    role: Lead DevOps Engineer
    period: Gen 2023 — Giu 2024
    description:
      - "Guidato un team trasversale di 3 engineer (un junior DevOps, uno stagista
        e uno sviluppatore embedded in transizione verso il DevOps): progettata ogni
        soluzione e realizzata la prima istanza, poi formato il team per completare
        il resto, con responsabilità su intake dei progetti, scelta degli approcci in
        base a costo, affidabilità e performance, e scomposizione del lavoro in task
        adatti a ciascun engineer."
      - "Gestiti ~45 clienti su AWS, VPS Contabo a basso costo, DigitalOcean e
        hardware on-premise. Spostati 24 di loro dall'account AWS condiviso su
        account dedicati per cliente costruiti da zero con uno stack Terraform
        riutilizzabile di 13 moduli (networking VPC con peering e Transit Gateway,
        DNS, ACM, IAM, ELB, SES, database, ECR, ECS, EFS, GitLab, CloudFront,
        Lambda), mentre il resto restava su Contabo, DigitalOcean e l'account
        condiviso; con onboarding di quattro nuovi clienti."
      - "Guidato il team nella migrazione dei workload dei clienti su ~20 cluster
        ECS (Fargate) — 150+ servizi più Lambda per job di background — sostituendo
        host EC2/EBS amministrati manualmente e sovradimensionati, dove alcuni
        database di produzione erano semplici container Postgres su EC2, con
        un'infrastruttura ibrida su AWS, Contabo, Cloudflare e DigitalOcean gestita
        con Terraform."
      - "Standardizzato la delivery di ~50 progetti su GitLab CI/CD e Jenkins con
        runner self-hosted — build dell'immagine, push su ECR, release su Fargate via
        AWS CLI — monitorando i runner e amministrando Redis e PostgreSQL (RDS) in
        produzione."
      - "Ridotto il Largest Contentful Paint (LCP) del sito WordPress di un cliente
        da ~27s a ~2s con CloudFront, un proxy Lambda per le immagini che le
        convertiva in AVIF per la cache del CDN, e un Lambda che preriscaldava la
        cache richiedendo direttamente dal sito ogni endpoint delle immagini;
        misurato con Google PageSpeed Insights."
      - "Serviti ~30 siti WordPress a basso costo da VPS Contabo dietro il piano
        gratuito di Cloudflare con un unico set di regole di ottimizzazione, e gestiti
        CloudFront, DNS multi-zona e protezione DDoS su tutto l'ambiente."
      - "Scritto un playbook Ansible che distribuiva l'applicazione web di una banca
        in Podman sulle loro VM Red Hat — sviluppato con rollback da snapshot — poi
        consegnato al loro team IT per l'esecuzione, rispettando una policy che
        vietava l'accesso di terzi alla loro infrastruttura."
      - "Ridotta la spesa AWS mensile da ~€12k a ~€6k sui clienti ospitati su AWS
        ridimensionando la capacità ECS, terminando istanze RDS ed EC2 inattive e
        duplicate, snapshot, NAT gateway inutilizzati ed Elastic IP non allocati,
        pianificando lo spegnimento fuori orario di RDS ed ECS di sviluppo e
        staging di ogni cliente con l'AWS Services Scheduler (il modulo Terraform
