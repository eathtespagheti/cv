experience:
  - company: BizAway
    role: Platform Engineer
    period: Lug 2024 — Presente
    description:
      - "Guidata la progettazione e la prima implementazione di uno step di rilascio
        condiviso su Bitbucket Pipelines, poi esteso a ~24 servizi su tre
        applicazioni — in sostituzione di pipeline per-progetto incoerenti e
        difficili da debuggare — riducendo il rischio di rilascio con deploy canary,
        pipeline di back-merge, un merge check personalizzato e un quality gate
        SonarQube."
      - "Costruita la prima versione della pipeline delle immagini Docker —
        BuildKit, Dockerfile multi-stage, pubblicazione multi-architettura (ARM64) e
        pull-through cache ECR — poi portata in adozione sui progetti; risolto un
        incidente di produzione sul limite di pull rate di Docker Hub e introdotte
        policy di lifecycle ECR per controllare la retention delle immagini."
      - "Gestiti tre cluster EKS (QA, staging e produzione), aggiornati a ogni
        release minor di Kubernetes a una settimana di distanza, ruotando i node
        group tramite surge capacity e PodDisruptionBudget con validazione di add-on
        e CRD, senza interruzioni visibili agli utenti in produzione. Mantenuto il runbook
        ufficiale EKS Cluster Upgrade (AWS Upgrade Insights, scansione con
        kubent/Pluto, validazione della compatibilità degli add-on) come riferimento
        per ogni upgrade, con i ticket di change conservati come traccia di audit."
      - "Introdotto il chart Helm interno diventato lo standard per il deploy dei
        servizi in casa — specifiche, template e migrazione di ~24 servizi su
        produzione e staging, con Deployment canary, routing pesato su
        Traefik, validazione dello schema dei values e pipeline di release OCI che
        blocca le versioni esistenti."
      - "Guidata la transizione a un modello di delivery GitOps con Flux CD —
        stabilendo il pattern, poi migrando deploy step e deploy di stage in tutto il
        team — con Flux che riconcilia ~24 servizi su staging e produzione, segreti
        cifrati con SOPS e AWS KMS, e ripristino di staging dopo che una
        kustomization errata ha espulso i deployment gestiti."
      - "Gestito Terraform su tre ambienti AWS e tre cluster EKS — networking VPC,
        IAM e OIDC pipeline-to-AWS in tre ambienti, con Infisical come sorgente di
        segreti per Terraform, SOPS cifrato con AWS KMS nel repo GitOps e AWS
        Secrets Manager e SSM Parameter Store per i segreti a runtime."
      - "Distribuito Keycloak via Helm e gestito realm, client OIDC, gruppi e ruoli
        come codice con il provider Terraform, proteggendo le webapp interne tramite
        OAuth2-proxy davanti a Keycloak OIDC."
      - "Progettata e gestita una flotta di runner Bitbucket self-hosted su AWS EC2
        — runner shell e Docker su ogni istanza, cleanup con systemd e inotify,
        recupero dello storage in base all'utilizzo e gestione del ciclo di vita di
        runner/AMI — poi migrata al Bitbucket Pipelines Runners Autoscaler ufficiale
        — runner containerizzati su Kubernetes — riducendo il tempo di attesa in coda
        delle pipeline da ~30 minuti nei picchi a ~45–60 secondi al massimo, limitato
        dal tempo di scale-up dei nodi con Karpenter."
      - "Gestito lo stack di osservabilità in produzione — Elasticsearch, Kibana,
        Grafana, APM e alerting Slack — con alert mirati aggiunti al manifestarsi di
        nuovi tipi di guasto."
      - "Gestito Redis in produzione su AWS ElastiCache, incluso il comportamento
        di failover e le policy di eviction e scaling."
      - "Costruiti ambienti E2E (Playwright, MongoDB, Redis, Elasticsearch, Kafka) e
        ridotto il tempo delle pipeline E2E da ~20 minuti a ~13 minuti
        mantenendo persistente la cache Docker/BuildKit sui runner self-hosted."
      - "Progettato e sviluppato un gestore di ambienti QA self-service che
        ha sostituito il provisioning basato su ticket — prima mezza giornata (a
        volte una giornata intera) di lavoro di un infra engineer per ambiente — con
        creazione, cambio branch ed eliminazione in un clic, orchestrando i manifest
        Kubernetes tramite Bitbucket Pipelines e Flux CD. Ogni ambiente girava nel
        proprio namespace, raggiungibile su un sottodominio dedicato di quarto
        livello; la sospensione portava a zero ogni Deployment, StatefulSet e
        DaemonSet e la ripresa li ripristinava, mantenendo definito l'ambiente. Fino
        a ~50 ambienti attivi in contemporanea, ciascuno pronto in ~10 minuti ed
        eseguendo fino a ~9 servizi."
      - "Autore di un plugin middleware Traefik in Go che riscrive header di
        richiesta e risposta da regole Go-template — avvolgendo http.ResponseWriter
        così che gli header impostati a fine risposta vengano comunque riscritti —
        per aggirare un limite di cinque origin consentite in uno strumento
        analytics di terze parti; testato su net/http/httptest e con linting
        golangci-lint."
    stack:
