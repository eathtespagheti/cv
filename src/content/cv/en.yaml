  - company: Abika
    role: Lead DevOps Engineer
    period: Jan 2023 — Jun 2024
    description:
      - "Led a cross-skilled team of 3 engineers (a junior DevOps engineer, a
        trainee and an embedded developer moving into DevOps): designed each
        solution and delivered its first instance, then taught the team to complete
        the rest, owning project intake, approach selection by cost, reliability and
        performance, and task breakdown."
      - "Ran ~45 clients across AWS, low-cost Contabo VPS, DigitalOcean and
        on-premise hardware. Moved 24 of them off the shared AWS account onto
        dedicated per-client accounts built from scratch with a reusable 13-module
        Terraform stack (VPC networking with peering and Transit Gateway, DNS, ACM,
        IAM, ELB, SES, databases, ECR, ECS, EFS, GitLab, CloudFront, Lambda), while
        the rest stayed on Contabo, DigitalOcean and the shared account; onboarded
        four new clients."
      - "Led the team migrating client workloads onto ~20 ECS (Fargate) clusters —
        150+ services plus Lambda for background jobs — replacing manually
        administered, overprovisioned EC2/EBS hosts, where some production
        databases were plain Postgres containers on EC2, with a hybrid estate on
        AWS, Contabo, Cloudflare and DigitalOcean managed with Terraform."
      - "Standardised delivery for ~50 projects on GitLab CI/CD and Jenkins over
        self-hosted runners — build image, push to ECR, release on Fargate through
        the AWS CLI — while monitoring the runners and administering production
        Redis and PostgreSQL (RDS)."
      - "Cut Largest Contentful Paint (LCP) on a client's WordPress site from ~27s
        to ~2s with CloudFront, a Lambda image proxy that converted images to AVIF
        for the CDN to cache, and a Lambda that pre-warmed the cache by requesting
        each image endpoint directly from the site; measured in Google PageSpeed
        Insights."
      - "Served ~30 low-cost WordPress sites from Contabo VPS behind Cloudflare's
        free tier with one shared delivery-optimisation ruleset, and managed
        CloudFront, multi-zone DNS and DDoS protection across the estate."
      - "Wrote an Ansible playbook that deployed a bank's web application into
        Podman on their own Red Hat VMs — developed against snapshot rollback — then
        handed it to their IT team to run, meeting a policy that barred third-party
        access to their infrastructure."
      - "Cut monthly AWS spend from ~€12k to ~€6k across the AWS-hosted clients
        by right-sizing ECS capacity, deleting inactive and duplicated RDS
        instances, EC2 instances, snapshots, unused NAT gateways and unallocated
        Elastic IPs, scheduling off-hours shutdown of every client's development and
        staging RDS and ECS with the AWS Services Scheduler (the open-source
        Terraform module listed under projects, later adopted internally), moving
        low-tier deployments to Contabo VPS,
        and moving steady-state capacity to AWS Savings Plans with an external
        partner managing them."
