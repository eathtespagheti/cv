experience:
  - company: BizAway
    role: Platform Engineer
    period: Jul 2024 — present
    description:
      - "Led the design and first implementation of a shared Bitbucket Pipelines
        release step, then rolled it out across ~24 services in three
        applications — replacing per-project pipelines that were
        inconsistent and hard to debug — cutting release risk with canary
        deployments, back-merge pipelines, a custom merge check and a SonarQube
        quality gate."
      - "Built the first version of the Docker image pipeline — BuildKit,
        multi-stage Dockerfiles, multi-architecture (ARM64) publishing and ECR
        pull-through caching — then drove its adoption across projects; resolved a
        Docker Hub pull-rate-limit production incident and enforced ECR lifecycle
        policies to control image retention."
      - "Operated three EKS clusters (QA, staging and production), upgrading all
        three on every Kubernetes minor release, one week apart, rotating node groups
        through surge capacity and PodDisruptionBudgets with add-on and CRD
        validation, and no user-visible production outage. Maintained the official
        EKS Cluster Upgrade Runbook (AWS Upgrade Insights, kubent/Pluto scanning,
        add-on compatibility validation) as the reference for every upgrade, with the
        change records for those upgrades kept as the audit trail."
      - "Authored the internal Helm chart that became the standard way to deploy
        in-house services — spec, templates and migration of ~24 services across
        production and staging, with canary Deployments, weighted Traefik
        routing, values-schema validation and a version-blocking OCI release
        pipeline."
      - "Drove the transition to a GitOps delivery model with Flux CD —
        establishing the pattern, then migrating deploy steps and stage
        deployments across the team — with Flux reconciling ~24 services across
        staging and production, secrets encrypted with SOPS and AWS KMS, and
        recovery of staging after a bad kustomization evicted its managed
        deployments."
      - "Managed Terraform across three AWS environments and three EKS clusters —
        VPC networking, IAM, and OIDC pipeline-to-AWS in three environments, with
        Infisical as a Terraform secret source, SOPS encrypted with AWS KMS in the
        GitOps repo, and AWS Secrets Manager and SSM Parameter Store for runtime
        secrets."
      - "Deployed Keycloak via Helm and managed its realms, OIDC clients, groups
        and roles as code with the Terraform provider, gating internal webapps
        through OAuth2-proxy in front of Keycloak OIDC."
      - "Designed and operated a self-hosted Bitbucket runner fleet on AWS EC2 —
        both shell and Docker runners on each instance, systemd and inotify-based
        cleanup, usage-based storage reclamation and runner/AMI lifecycle
        management — then migrated it to the official Bitbucket Pipelines Runners
        Autoscaler — containerised runners on Kubernetes — cutting pipeline queue
        time from ~30 minutes at peak to ~45–60 seconds at the top, bounded by
        Karpenter node scale-up time."
      - "Operated the production observability stack — Elasticsearch, Kibana,
        Grafana, APM and Slack alerting — adding targeted alerts as new failure
        modes appeared."
      - "Operated production Redis on AWS ElastiCache, including failover
        behaviour, eviction and scaling policies."
      - "Built E2E environments (Playwright, MongoDB, Redis, Elasticsearch, Kafka)
        and cut E2E pipeline time from ~20 minutes to ~13 minutes by
        persisting the Docker/BuildKit cache on the self-hosted runners."
      - "Designed and built a self-service QA environment manager that replaced
        ticketed provisioning — previously half a day (sometimes a full day) of an
        infra engineer's time per environment — with one-click create, branch-change
        and delete, orchestrating Kubernetes manifests through Bitbucket Pipelines
        and Flux CD. Each environment ran in its own namespace, reachable on a
        dedicated fourth-level subdomain; suspend scaled every Deployment,
        StatefulSet and DaemonSet to zero and resume restored them, with the
        environment definition kept. Up to ~50 environments ran concurrently, each
        ready in ~10 minutes and running up to ~9 services."
      - "Authored a Traefik middleware plugin in Go that rewrites request and
        response headers from Go-template rules — wrapping the http.ResponseWriter
        so headers set late in the response are still rewritten — to work around a
        fixed five-origin allow-list in a third-party analytics tool; tested on
        net/http/httptest and linted with golangci-lint."
    stack:
      - AWS EKS
      - Terraform
