  - slug: teslamate-fuel-roi
    order: 17
    name: teslamate-fuel-roi
    role: Author / Operator
    year: "2026 — present"
    description: >
      An Italy-only fuel-price importer and two Grafana dashboards that turn
      TeslaMate's trip data into fuel cost avoided and EV return on investment.
      One container downloads and fail-closed-validates the MASE weekly price
      report, then upserts previously unseen weeks into a fuel.prices table
      alongside existing TeslaMate data. The dashboards are provision-ready JSON
      over the TeslaMate Postgres datasource, computing gross and net savings and
      an estimated break-even date against a configurable purchase price. Runs
      weekly as a Compose job or a Kubernetes CronJob, linted and tested in
      GitLab CI and GitHub Actions.
