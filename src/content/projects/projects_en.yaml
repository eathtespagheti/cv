      - label: Delivery
        value: GitLab CI, tagged image
      - label: Runtime
        value: nginx on :8080
    stack:
      - Astro
      - TypeScript
      - Node.js
      - YAML content collections and Zod
      - Playwright (PDF and OG image)
      - docx and unpdf
      - Nunjucks
      - Docker (multi-stage)
      - nginx
      - GitLab CI/CD
      - GitLab Container Registry
