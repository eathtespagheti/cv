projects:
  - slug: kubernetes-homelab
    order: 1
    name: Advanced Kubernetes Homelab
    role: Architect / Operator
    year: "2019 — present"
    description: >
      A single-node homelab built on kubeadm, evolved from a legacy
      Docker host. Fully declarative and GitOps-managed with Flux; all secrets
      encrypted at rest with SOPS and age. Cilium provides eBPF-based networking
      as a complete kube-proxy replacement, with L2 announcements, L7 ingress
      controllers and Gateway API routing. Split-horizon DNS via k8s-gateway with
      Quad9 DoT upstream and Cloudflare DDNS for external access. Central IAM via
      Keycloak with OIDC, Google IdP federation and custom RBAC across self-hosted
      services, plus a self-hosted Headscale control plane for cross-site
      tunnels with embedded DERP relays. A single forwarded ingress is the only
      public entry point; every other service is LAN/VPN-only. Certificates are
      issued automatically by cert-manager, and Prometheus/Grafana provide
      in-cluster monitoring.
    category: Infrastructure
    theme: blue
    featured: true
    platforms: [Kubernetes, Linux, Self-hosted]
    tags: [kubernetes, cilium, ebpf, gitops, flux, sops, keycloak, oidc, cert-manager, headscale, gateway-api, prometheus, hubble, homelab]
    metrics:
      - label: Orchestrator
        value: kubeadm (single node)
      - label: Networking
        value: Cilium eBPF
      - label: Public surface
        value: One forwarded ingress
      - label: Identity
        value: Keycloak OIDC / RBAC
      - label: Secrets
        value: SOPS + age
    stack:
      - Kubernetes (kubeadm)
      - Cilium eBPF
      - Flux Operator + Flux CD
      - SOPS + age
      - cert-manager / Let's Encrypt
      - Keycloak
      - Headscale / Tailscale
      - Gateway API
      - CloudNativePG (PostgreSQL)
      - k8s-gateway
      - Prometheus / Grafana
      - Hubble
      - Cloudflare DDNS
      - Quad9 DoT
    media:
      - type: image
        src: /media/projects/kubernetes-homelab/headlamp-map.png
        alt: Headlamp namespace map of the cluster, grouping Deployments, StatefulSets and Jobs by namespace
        featured: true
      - type: image
        src: /media/projects/kubernetes-homelab/headlamp-workloads.png
        alt: Headlamp workload summary showing every Pod, Deployment, StatefulSet, DaemonSet and Job healthy

  - slug: llm-workspace
    order: 3
    name: Self-Hosted LLM & Agentic Coding Workspace
    role: Architect / Operator
    year: "2026 — present"
    description: >
      A self-hosted LLM and agentic-coding platform on the Kubernetes homelab,
      fully GitOps-managed with Flux and secured through Keycloak OIDC. Open
      WebUI is the chat front-end; MetaMCP aggregates multiple MCP servers —
      Playwright, Home Assistant, SearXNG, Grafana and the Tesla Fleet API among
      them — into namespaces and endpoints; and OmniRoute is an
      OpenAI-compatible gateway providing provider routing, automatic fallback,
      prompt compression and a Qdrant-backed memory store. SearxNG serves
      private web search and Open Terminal a browser terminal, with an external
      Linux host running local models through Ollama. CloudNativePG Postgres,
      Valkey and Qdrant back the stack, exposed through one shared ingress with
      automatic TLS.
    category: AI Infrastructure
    theme: magenta
    featured: true
    platforms: [Kubernetes, Self-hosted, AI]
    tags: [kubernetes, llm, ai-gateway, mcp, agentic-coding, opencode, open-webui, omniroute, metamcp, searxng, ollama, qdrant, cloudnativepg, keycloak, gitops, flux]
    metrics:
      - label: Gateway
        value: OmniRoute (OpenAI-compatible)
      - label: Tool access
        value: MetaMCP aggregation
      - label: Chat & models
        value: Open WebUI + Ollama
      - label: Data
        value: Postgres / Valkey / Qdrant
      - label: Delivery
        value: Flux GitOps + OIDC
    stack:
      - Kubernetes (kubeadm)
      - Flux CD (GitOps)
      - Open WebUI
      - OmniRoute
      - MetaMCP
      - SearxNG
      - Open Terminal
      - Ollama
      - CloudNativePG (PostgreSQL)
      - Valkey
      - Qdrant
      - Keycloak OIDC
      - SOPS + age
      - Cilium
    media:
      - type: image
        src: /media/projects/llm-workspace/omniroute.png
        alt: OmniRoute usage dashboard with token and request totals, provider and model counts, and cost split by provider
        featured: true
      - type: image
        src: /media/projects/llm-workspace/mcp.png
        alt: MetaMCP server list showing STDIO and streamable-HTTP MCP servers, all healthy

  - slug: cv-platform
    order: 2
    name: CV & Cover-Letter Platform
    role: Developer / Maintainer
    year: "2026 — present"
    description: >
      The YAML-driven personal CV and portfolio platform behind this site. One
      source of truth renders the site plus a recruiter PDF, a single-column
      ATS-safe PDF, an editable DOCX and plain text, and generates tailored
      cover letters from reusable narrative blocks. A five-step Node build
      pipeline drives Astro, exports the documents through headless Chromium and
      screenshots the built site for social previews. Packaged as a multi-stage
      container served by nginx and shipped through GitLab CI/CD, which validates
      content on every push and publishes tagged releases to the container
      registry. Extends the MIT-licensed cv_hub framework with reworked content,
      build and deployment tooling.
    category: Developer Tooling
    theme: emerald
    platforms: [Web, Docker]
    tags: [astro, typescript, nodejs, docker, gitlab-ci, nginx, playwright, static-site, cover-letter, container]
