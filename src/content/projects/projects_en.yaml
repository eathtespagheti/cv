  - slug: gitlab-mirroring
    order: 18
    name: GitLab ⇄ GitHub Mirror
    role: Author / Operator
    year: "2026 — present"
    description: >
      A single POSIX shell script that reconciles a personal GitLab and GitHub
      account and keeps them mirrored on the free tier. It audits both sides for
      repositories missing from the other, missing, disabled or duplicated push
      mirrors, visibility mismatches, empty repositories and divergent histories;
      creates the missing counterpart repository and configures a server-side
      GitLab-to-GitHub push mirror; and runs a scheduled GitHub-to-GitLab safety
      net that fast-forwards commits pushed straight to GitHub. GitLab stays
      canonical, and every reconcile path only creates or fast-forwards a ref -
      nothing is deleted and no force-mirror push is used.
    category: Developer Tooling
    theme: emerald
    platforms: [CLI, Linux]
    tags: [shell, posix, git, gitlab, github, api, mirroring, systemd, automation, cli]
    metrics:
      - label: Language
        value: POSIX sh (~1,000 lines)
      - label: Direction
        value: GitLab → GitHub push mirror
      - label: Safety net
        value: GitHub → GitLab (systemd timer)
      - label: Runtime deps
        value: git, gh, glab
      - label: Tests
        value: Hermetic shell suite (faked CLIs)
    stack:
      - POSIX shell
      - GitLab REST API
      - GitHub REST API (gh CLI)
      - glab CLI
      - Git plumbing (bare cache, refspecs)
      - systemd
    links:
      - label: Source (GitLab)
        url: https://gitlab.com/eathtespagheti/gitlab-mirroring
        type: repo
      - label: Source (GitHub)
        url: https://github.com/eathtespagheti/gitlab-mirroring
        type: repo
