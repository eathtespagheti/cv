  - slug: octopus-prices
    order: 15
    name: octopus-prices
    role: Author / Operator
    year: "2026 — present"
    description: >
      A self-hosted tariff tracker and Telegram bot for Octopus Energy Italy,
      packaged as a reusable Helm chart. An hourly Kubernetes CronJob scrapes
