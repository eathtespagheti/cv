    name: Self-Service QA Environment Manager
    role: Sviluppatore
    year: "2025 — 2026"
    description: >
      Un'applicazione interna di developer platform che offre ai team - inclusi
      gli utenti non tecnici - ambienti QA isolati on-demand con un click,
      completamente automatizzati tramite Flux. Include il monitoraggio in tempo
      reale per pipeline, una modale di deploy in primo piano che copre le fasi
      di build, release e health, operazioni in background di
      sospensione/ripresa/eliminazione con una finestra di attività, una
      protezione di navigazione contro l'uscita a metà deploy, un flusso di
      supporto Slack con un click che porta con sé le ultime righe di log della
      pipeline fallita, e una notifica per tab inattiva.
