        value: ~24 servizi, 2 cluster
      - label: Superficie
        value: 11 tipi Kubernetes, un solo chart
      - label: Delivery
        value: Track canary + Traefik pesato
      - label: Sicurezza
        value: Values validati da schema, release bloccata
    stack:
      - Helm
      - Kubernetes
      - Traefik
      - Bitbucket Pipelines
      - Registry OCI

  - slug: teslamate-fuel-roi
    order: 17
    name: teslamate-fuel-roi
    role: Autore / Operatore
    year: "2026 — presente"
    description: >
      Un importatore di prezzi carburante, solo per l'Italia, e due dashboard
      Grafana che trasformano i dati di viaggio di TeslaMate in carburante
      evitato e ritorno sull'investimento EV. Un solo container scarica e valida
      fail-closed il report settimanale dei prezzi MASE, poi inserisce le
      settimane non ancora viste in una tabella fuel.prices accanto ai dati
      TeslaMate esistenti. Le dashboard sono JSON pronti per il provisioning
      sopra la datasource Postgres di TeslaMate, e calcolano risparmio lordo e
      netto e una data di break-even stimata rispetto a un prezzo d'acquisto
      configurabile. Gira settimanalmente come job Compose o CronJob Kubernetes,
      con lint e test in GitLab CI e GitHub Actions.
    category: Osservabilità
    theme: emerald
    platforms: [Kubernetes, Docker, PostgreSQL]
    tags: [grafana, postgresql, sql, kubernetes, cronjob, kustomize, docker, docker-compose, gitlab-ci, github-actions, shell, jq, observability, teslamate]
    metrics:
      - label: Dashboard
        value: JSON Grafana pronti per il provisioning
      - label: Pipeline
        value: Fetch, validazione, upsert idempotente
      - label: Datasource
        value: PostgreSQL (TeslaMate)
