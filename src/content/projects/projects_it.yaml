projects:
  - slug: kubernetes-homelab
    order: 1
    name: Homelab Kubernetes avanzato
    role: Architetto / Operatore
    year: "2019 — presente"
    description: >
      Un homelab single-node costruito su kubeadm, evoluto da un
      host Docker legacy. Completamente dichiarativo e gestito in GitOps con
      Flux; tutti i segreti cifrati a riposo con SOPS e age. Cilium fornisce
      networking basato su eBPF come completa sostituzione di kube-proxy, con
      annunci L2, ingress controller L7 e routing Gateway API. DNS split-horizon
      tramite k8s-gateway con upstream Quad9 DoT e Cloudflare DDNS per
      l'accesso esterno. IAM centralizzato tramite Keycloak con OIDC, federazione
      Google IdP e RBAC personalizzato su servizi self-hosted, oltre a un control
      plane Headscale self-hosted per tunnel cross-site con relay DERP integrati.
      Un unico ingress forwardato è l'unico punto d'ingresso pubblico; ogni altro
      servizio è solo LAN/VPN. I certificati sono emessi automaticamente da
      cert-manager, e Prometheus/Grafana forniscono il monitoraggio in-cluster.
    category: Infrastruttura
    theme: blue
    featured: true
    platforms: [Kubernetes, Linux, Self-hosted]
    tags: [kubernetes, cilium, ebpf, gitops, flux, sops, keycloak, oidc, cert-manager, headscale, gateway-api, prometheus, hubble, homelab]
    metrics:
      - label: Orchestratore
        value: kubeadm (single node)
      - label: Networking
        value: Cilium eBPF
      - label: Superficie pubblica
        value: Un ingress forwardato
      - label: Identità
        value: Keycloak OIDC / RBAC
      - label: Segreti
        value: SOPS + age
    stack:
      - Kubernetes (kubeadm)
      - Cilium eBPF
      - Flux Operator + Flux CD
      - SOPS + age
      - cert-manager / Let's Encrypt
      - Keycloak
      - Headscale / Tailscale
      - Gateway API
      - CloudNativePG (PostgreSQL)
      - k8s-gateway
      - Prometheus / Grafana
      - Hubble
      - Cloudflare DDNS
      - Quad9 DoT
    media:
      - type: image
        src: /media/projects/kubernetes-homelab/headlamp-map.png
        alt: Mappa dei namespace del cluster in Headlamp, con Deployments, StatefulSets e Jobs raggruppati per namespace
        featured: true
      - type: image
        src: /media/projects/kubernetes-homelab/headlamp-workloads.png
        alt: Riepilogo dei workload in Headlamp con ogni Pod, Deployment, StatefulSet, DaemonSet e Job in stato healthy

  - slug: llm-workspace
    order: 3
    name: Workspace LLM e agentic coding self-hosted
    role: Architetto / Operatore
    year: "2026 — presente"
    description: >
      Una piattaforma LLM e agentic-coding self-hosted sull'homelab Kubernetes,
      gestita interamente con GitOps tramite Flux e protetta da Keycloak OIDC.
      Open WebUI è il front-end di chat; MetaMCP aggrega diversi server MCP —
      tra cui Playwright, Home Assistant, SearxNG, Grafana e la Tesla Fleet API
      — in namespace ed endpoint; OmniRoute è un gateway compatibile OpenAI che
      offre routing tra provider, fallback automatico, compressione dei prompt
      e uno store di memoria su Qdrant. SearxNG fornisce la ricerca web privata
      e Open Terminal un terminale browser, con un host Linux esterno che esegue
      modelli locali tramite Ollama. PostgreSQL (CloudNativePG), Valkey e Qdrant
      sostengono lo stack, esposto tramite un unico ingress condiviso con TLS
      automatico.
    category: AI Infrastructure
    theme: magenta
    featured: true
    platforms: [Kubernetes, Self-hosted, AI]
    tags: [kubernetes, llm, ai-gateway, mcp, agentic-coding, opencode, open-webui, omniroute, metamcp, searxng, ollama, qdrant, cloudnativepg, keycloak, gitops, flux]
    metrics:
      - label: Gateway
        value: OmniRoute (compatibile OpenAI)
      - label: Accesso ai tool
        value: Aggregazione MetaMCP
      - label: Chat e modelli
        value: Open WebUI + Ollama
      - label: Dati
        value: Postgres / Valkey / Qdrant
      - label: Delivery
        value: Flux GitOps + OIDC
    stack:
      - Kubernetes (kubeadm)
      - Flux CD (GitOps)
      - Open WebUI
      - OmniRoute
      - MetaMCP
      - SearxNG
      - Open Terminal
      - Ollama
      - CloudNativePG (PostgreSQL)
      - Valkey
      - Qdrant
      - Keycloak OIDC
      - SOPS + age
      - Cilium
    media:
      - type: image
        src: /media/projects/llm-workspace/omniroute.png
        alt: Dashboard di utilizzo di OmniRoute con i totali di token e richieste, il conteggio di provider e modelli e il costo suddiviso per provider
        featured: true
      - type: image
        src: /media/projects/llm-workspace/mcp.png
        alt: Elenco dei server MCP in MetaMCP con server STDIO e streamable-HTTP, tutti senza errori

  - slug: cv-platform
    order: 2
    name: Piattaforma CV e cover letter
    role: Sviluppatore / Maintainer
    year: "2026 — presente"
    description: >
      La piattaforma personale di CV e portfolio basata su YAML dietro questo
      sito. Un'unica fonte di verità rende il sito più un PDF per i recruiter,
      un PDF ATS-safe a colonna singola, un DOCX modificabile e testo semplice,
      e genera cover letter su misura da blocchi narrativi riutilizzabili. Una
      pipeline di build Node in cinque passaggi guida Astro, esporta i documenti
      tramite Chromium headless e cattura screenshot del sito compilato per le
      anteprime social. Pacchettizzata come container multi-stage servito da
      nginx e pubblicato da GitLab CI a ogni push e sulle release taggate nel
      container registry. Estende il framework cv_hub con licenza MIT con
      contenuti, build e tooling di deployment rielaborati.
    category: Tooling per sviluppatori
    theme: emerald
    platforms: [Web, Docker]
    tags: [astro, typescript, nodejs, docker, gitlab-ci, nginx, playwright, static-site, cover-letter, container]
    metrics:
      - label: Fonte di verità
        value: Un CV YAML
      - label: Output
        value: Sito + PDF/DOCX/TXT
      - label: Documenti
        value: Export con Chromium headless
      - label: Delivery
        value: GitLab CI, immagine taggata
      - label: Runtime
        value: nginx su :8080
    stack:
      - Astro
      - TypeScript
      - Node.js
      - Collezioni di contenuti YAML e Zod
      - Playwright (PDF e immagine OG)
      - docx e unpdf
      - Nunjucks
      - Docker (multi-stage)
      - nginx
      - GitLab CI/CD
      - GitLab Container Registry
    media:
