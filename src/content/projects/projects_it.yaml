  - slug: internal-helm-chart
    order: 16
    name: Chart Helm applicativo interno
    role: Autore / Maintainer
    year: "2024 — presente"
    description: >
      Il chart Helm interno diventato lo standard per distribuire i servizi
      sviluppati in casa su Kubernetes: un unico chart generico che rende
      Deployment, Service, Ingress / IngressRoute, HPA, PDB, ServiceAccount,
      ConfigMap e Secret, con track canary opzionale e routing pesato su Traefik.
      Adottato da ~24 servizi su produzione e staging. I values
      sono validati da schema e le release vanno su un registry OCI tramite una
      pipeline che rifiuta di ripubblicare una versione esistente.
    category: Piattaforma per sviluppatori
    theme: blue
    platforms: [Kubernetes]
    tags: [helm, kubernetes, gitops, traefik, canary, oci, schema-validation, developer-platform]
    metrics:
