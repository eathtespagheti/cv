# Baseline security headers, applied to every response.
#
# This lives in a snippet rather than three lines at server level because
# nginx's `add_header` *replaces* the inherited list instead of extending it: a
# context that declares any `add_header` of its own stops inheriting its
# parent's. The cache locations set `Cache-Control`, so without re-applying the
# trio here they silently served zero security headers — issue #2.
#
# `include` this in the server block (for every location that does not set a
# header) *and* in every location that does. Keeping the list in one file means
# a location can no longer drift out of sync with it.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
